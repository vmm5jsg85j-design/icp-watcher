name: Tests

# Runs on every push and PR. Two things here are worth a machine checking: the
# alert ladders, which are pure logic with state carried between calls, and the
# buy/sell split, which is duplicated across two files and was wrong in both.
on: [push, pull_request]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # alert_levels and check.py are standard library only, but the snapshot
      # tests also import icp_client, which needs httpx and python-dotenv.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python3 -m unittest discover -v

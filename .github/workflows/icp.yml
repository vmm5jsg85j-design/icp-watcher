name: ICP watch

# Расписание отключено намеренно. Рабочий вариант теперь — постоянно
# работающий сервис на Railway (main.py): он проверяет цену раз в минуту,
# отвечает на /icp и шлёт сводку точно в срок. Если оставить cron включённым,
# в группу будут приходить одни и те же уведомления дважды — из двух мест.
#
# Заодно снялся и повод для переживаний: за полтора часа GitHub не выполнил
# ни одного запуска по расписанию (пропущены слоты 13:07, 13:37, 14:07 UTC),
# при том что ветка по умолчанию верная, workflow валиден и Actions были в
# статусе operational. Их cron выполняется по остаточному принципу.
#
# Ручной запуск оставлен: он полезен как разовая проверка и как запасной путь,
# если сервис на Railway почему-то встанет.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "alert или digest"
        required: false
        default: digest

# Нужно, чтобы шаг ниже мог закоммитить state.json обратно.
permissions:
  contents: write

# Два запуска подряд не должны драться за state.json.
concurrency:
  group: icp-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python есть на ubuntu-latest из коробки, а скрипт работает на голой
      # стандартной библиотеке — поэтому ни setup-python, ни pip install.
      - name: Check ICP
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Значения из github.event кладутся в переменные окружения, а НЕ
          # подставляются в текст скрипта. Прямая подстановка ${{ ... }} внутрь
          # run — классическая дыра GitHub Actions: содержимое поля попадает в
          # shell как код. Здесь поля безобидные, но в публичном репозитории
          # такой шаблон копируют, и однажды он подставит чужой ввод.
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          MODE=alert
          if [ "${SCHEDULE:-}" = "13 4 * * *" ]; then MODE=digest; fi
          if [ -n "${INPUT_MODE:-}" ]; then MODE="$INPUT_MODE"; fi
          case "$MODE" in
            alert|digest) ;;
            *) echo "Недопустимый режим: $MODE"; exit 1 ;;
          esac
          python3 check.py "$MODE"

      - name: Persist alert state
        run: |
          if git diff --quiet -- state.json; then
            echo "Состояние не изменилось — коммитить нечего."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update ICP alert state [skip ci]"
          git push

name: ICP watch

on:
  schedule:
    # Проверка роста каждые 30 минут. Интервал выбран не по вкусу, а по счёту:
    # Actions округляет КАЖДЫЙ запуск вверх до минуты, поэтому раз в 15 минут
    # это ~2900 минут в месяц — больше бесплатных 2000 у приватного репозитория.
    # Раз в 30 минут даёт ~1470 и укладывается. В публичном репозитории лимита
    # нет вообще, там можно вернуть */15.
    #
    # И учтите: GitHub выполняет cron по возможности, а не по секундам — на
    # бесплатном тарифе запуск часто сдвигается на 5-20 минут. Для порога
    # «+10% за 24 часа» это несущественно, для секундных сигналов не годится.
    - cron: "7,37 * * * *"
    # Ежедневная сводка около 09:00 по Ташкенту (UTC+5).
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "alert или digest"
        required: false
        default: digest

# Нужно, чтобы шаг ниже мог закоммитить state.json обратно.
permissions:
  contents: write

# Два запуска подряд не должны драться за state.json.
concurrency:
  group: icp-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python есть на ubuntu-latest из коробки, а скрипт работает на голой
      # стандартной библиотеке — поэтому ни setup-python, ни pip install.
      - name: Check ICP
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_THRESHOLD_PERCENT: "10"
          ALERT_REARM_PERCENT: "8"
          # Значения из github.event кладутся в переменные окружения, а НЕ
          # подставляются в текст скрипта. Прямая подстановка ${{ ... }} внутрь
          # run — классическая дыра GitHub Actions: содержимое поля попадает в
          # shell как код. Здесь поля безобидные, но в публичном репозитории
          # такой шаблон копируют, и однажды он подставит чужой ввод.
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          MODE=alert
          if [ "${SCHEDULE:-}" = "13 4 * * *" ]; then MODE=digest; fi
          if [ -n "${INPUT_MODE:-}" ]; then MODE="$INPUT_MODE"; fi
          case "$MODE" in
            alert|digest) ;;
            *) echo "Недопустимый режим: $MODE"; exit 1 ;;
          esac
          python3 check.py "$MODE"

      - name: Persist alert state
        run: |
          if git diff --quiet -- state.json; then
            echo "Состояние не изменилось — коммитить нечего."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update ICP alert state [skip ci]"
          git push
